<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CoCo学习工作台</title>
<style>
  :root{
    --card:#fff; --ink:#3a3450; --muted:#9a94ac; --line:#f0eef8;
    --accent:#7b6cff; --star:#ffb02e; --ok:#4ecb8f; --pink:#ff7aa8;
    --shadow:0 8px 24px rgba(120,100,190,.12); --r:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(165deg,#fff6e8 0%,#ffeff5 40%,#eef6ff 100%);
    color:var(--ink);min-height:100vh;padding-bottom:96px;
  }
  .app{max-width:560px;margin:0 auto;padding:16px 14px 28px}

  /* 顶部 */
  .hero{background:linear-gradient(135deg,#ffb26b,#ff85a8);border-radius:26px;padding:18px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-24px;bottom:-40px;width:130px;height:130px;background:rgba(255,255,255,.13);border-radius:50%}
  .hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
  .baby-avatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:32px}
  .hero-info h1{font-size:20px;margin:0;font-weight:800}
  .hero-info p{margin:3px 0 0;font-size:12px;opacity:.9}
  .hero-stats{display:flex;gap:9px;margin-top:14px;position:relative;z-index:1}
  .hs{flex:1;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.3);border-radius:15px;padding:9px;text-align:center}
  .hs b{display:block;font-size:20px;line-height:1.1}
  .hs span{font-size:11px;opacity:.92}
  .quit{position:absolute;top:14px;right:14px;z-index:2;border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:6px 11px;font-size:11px;cursor:pointer}

  .tipbar{margin-top:12px;background:#fffdf6;border:1.5px dashed #ffd79a;border-radius:16px;padding:11px 14px;font-size:13px;color:#a9762e;display:flex;gap:8px;align-items:center}
  .tipbar .hand{font-size:20px}

  .sec{margin:20px 2px 10px;display:flex;align-items:center;justify-content:space-between}
  .sec h2{font-size:16px;margin:0;font-weight:800}
  .sec small{font-size:12px;color:var(--muted)}

  /* 任务大卡片 */
  .tasks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .tcard{border-radius:24px;padding:18px 14px 16px;text-align:center;cursor:pointer;transition:.15s;position:relative;overflow:hidden;border:3px solid transparent;box-shadow:var(--shadow)}
  .tcard:active{transform:scale(.95)}
  .tcard.done{border-color:var(--ok)}
  .tcard .big{font-size:52px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.08))}
  .tcard h3{font-size:15px;margin:10px 0 3px;font-weight:800;color:var(--ink)}
  .tcard p{font-size:11px;margin:0;color:#8a849c}
  .tcard .check{position:absolute;top:9px;right:9px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff}
  .tcard.done .check{background:var(--ok)}
  .tcard .rb{margin-top:10px;display:inline-block;background:rgba(255,255,255,.8);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:800;color:#d98b1f}
  .tcard.done .rb{background:var(--ok);color:#fff}
  .c1{background:#fff0d9}.c2{background:#ffe6ef}.c3{background:#e3f0ff}.c4{background:#e9f8ef}.c5{background:#f0e9ff}

  /* 小红花进度 */
  .starbar{background:#fff;border-radius:20px;padding:15px;box-shadow:var(--shadow);margin-top:14px}
  .starbar .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .starbar .row b{font-size:14px}
  .starbar .row span{font-size:12px;color:var(--muted)}
  .flower-track{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:10px 0 6px}
  .fl{font-size:30px;line-height:1;transition:.2s;display:inline-block}
  .fl.on{filter:none}
  .fl.off{filter:grayscale(1);opacity:.2}
  .star-goal{font-size:11px;color:var(--muted);margin-top:7px;text-align:center}

  /* 学习内容记录 */
  .journal .row{display:flex;gap:8px;align-items:center}
  .journal input{flex:1;min-width:0;border:1.5px solid #e3e6f2;border-radius:13px;padding:11px 13px;font-size:13px;outline:none}
  .journal input:focus{border-color:var(--accent)}
  .journal .add{border:0;border-radius:13px;padding:11px 16px;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(135deg,#7b6cff,#9c8bff);cursor:pointer;white-space:nowrap}
  .jitem{display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}
  .jitem:last-child{border-bottom:0}
  .jitem .dot{width:8px;height:8px;border-radius:50%;background:#ffb02e;flex:0 0 auto;margin-top:6px}
  .jitem .txt{flex:1;font-size:13px;line-height:1.5;word-break:break-word}
  .jitem .tm{font-size:11px;color:var(--muted);margin-top:2px}
  .jitem .del{border:0;background:transparent;color:#c9c4d6;font-size:17px;cursor:pointer;line-height:1}

  /* 内容学习区 */
  .learn-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .back{border:0;background:#fff;border-radius:14px;padding:9px 14px;font-size:14px;font-weight:700;color:var(--accent);box-shadow:var(--shadow);cursor:pointer}
  .learn-head h2{font-size:18px;margin:0;font-weight:800}
  .grid-items{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .item{background:#fff;border-radius:18px;padding:14px 8px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:.12s;border:2px solid transparent}
  .item:active{transform:scale(.9)}
  .item.speaking{border-color:var(--accent);background:#f4f1ff}
  .item .glyph{font-size:36px;line-height:1.1;font-weight:800;color:var(--ink)}
  .item .lbl{font-size:12px;color:var(--muted);margin-top:6px}
  .item .emo{font-size:38px;line-height:1.1}
  .hint{font-size:12px;color:var(--muted);text-align:center;line-height:1.7;margin:14px 4px}
  .songs{display:flex;flex-direction:column;gap:10px}
  .song{background:#fff;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);cursor:pointer}
  .song .sn{font-size:30px}
  .song .si{flex:1}
  .song .si b{font-size:14px;display:block}
  .song .si span{font-size:11px;color:var(--muted)}
  .song .play{font-size:20px}
  .song.playing{border:2px solid var(--accent);background:#f4f1ff}
  .song-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .song-tools span{font-size:12px;color:var(--muted);line-height:1.5}
  .song-tools button{border:0;border-radius:12px;padding:8px 14px;font-size:12px;font-weight:800;color:var(--accent);background:#f4f1ff;cursor:pointer;white-space:nowrap}
  .song .lyric{border:0;background:#fff1f5;color:#ff7aa8;border-radius:12px;padding:8px 10px;font-size:16px;cursor:pointer}
  .song .video-tag{font-size:10px;color:#fff;background:#fb7299;border-radius:8px;padding:2px 6px;margin-left:6px;font-weight:800}
  .video-mask{position:fixed;inset:0;background:rgba(30,24,50,.72);z-index:9999;display:flex;align-items:center;justify-content:center;padding:14px}
  .video-box{background:#fff;border-radius:20px;width:100%;max-width:720px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.35)}
  .video-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:#f4f1ff}
  .video-bar b{font-size:14px;color:var(--ink)}
  .video-bar button{border:0;border-radius:10px;padding:7px 14px;font-size:13px;font-weight:800;color:#fff;background:var(--accent);cursor:pointer;white-space:nowrap}
  .video-frame{position:relative;width:100%;padding-top:56.25%;background:#000}
  .video-frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
  .video-foot{padding:12px 16px 16px;text-align:center}
  .video-foot span{font-size:12px;color:var(--muted);line-height:1.6;display:block;margin-bottom:10px}
  .video-foot button{border:0;border-radius:12px;padding:9px 16px;font-size:12px;font-weight:800;color:var(--accent);background:#f4f1ff;cursor:pointer}

  /* 奖励商店 */
  .shop-hero{background:linear-gradient(135deg,#ffc44d,#ff9f2e);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .shop-hero b{font-size:34px;display:block}
  .shop-hero span{font-size:12px;opacity:.92}
  .wish{background:#fff;border-radius:18px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;box-shadow:var(--shadow)}
  .wish .wi{font-size:34px;background:#fff1f5;border-radius:14px;padding:8px 12px}
  .wish .info{flex:1}
  .wish .info b{font-size:14px;display:block}
  .wish .info span{font-size:12px;color:var(--muted)}
  .wish button{border:0;border-radius:14px;padding:10px 14px;font-size:13px;font-weight:800;cursor:pointer;background:#f4f1ff;color:var(--accent)}
  .wish button.can{background:linear-gradient(135deg,#7b6cff,#9c8bff);color:#fff}
  .wish button:disabled{opacity:.5}

  /* 数据 */
  .ov{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .ov .box{background:#fff;border-radius:18px;padding:16px 8px;text-align:center;box-shadow:var(--shadow)}
  .ov .box b{display:block;font-size:24px;color:var(--accent)}
  .ov .box span{font-size:11px;color:var(--muted)}
  .card{background:#fff;border-radius:20px;padding:15px;box-shadow:var(--shadow);margin-bottom:12px}
  .card h3{font-size:14px;margin:0 0 10px}
  .fab{width:100%;border:1.5px dashed #cfc9e8;background:#faf9ff;color:var(--accent);border-radius:14px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px}
  .pinfield{margin-bottom:12px}
  .pinfield label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
  .pinrow{display:flex;gap:8px}
  .pinrow input{flex:1;min-width:0;border:1.5px solid #e3e6f2;border-radius:12px;padding:10px 12px;font-size:14px;outline:none}
  .pinrow button{border:0;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700;color:#fff;background:var(--accent);cursor:pointer}
  .log{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .log:last-child{border-bottom:0}

  /* 底部导航 */
  .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -4px 18px rgba(120,100,190,.08)}
  .nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer;width:20%}
  .nav button .ni{font-size:26px;line-height:1;filter:grayscale(.5);opacity:.55;transition:.15s}
  .nav button.on{color:var(--accent);font-weight:800}
  .nav button.on .ni{filter:none;opacity:1;transform:translateY(-2px)}

  .toast{position:fixed;left:50%;top:20%;transform:translateX(-50%) scale(.9);background:rgba(58,52,80,.94);color:#fff;padding:14px 24px;border-radius:24px;font-size:16px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) scale(1)}

  /* 撒花 */
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:55;overflow:hidden}
  .cf{position:absolute;top:-20px;font-size:26px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}

  /* 登录 */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{background:#fff;border-radius:26px;padding:30px 22px;width:100%;max-width:400px;box-shadow:0 12px 44px rgba(120,100,190,.18);text-align:center}
  .login-logo{font-size:60px}
  .login-card h1{font-size:22px;margin:8px 0 4px;font-weight:800}
  .login-card .desc{font-size:13px;color:var(--muted);margin:0 0 24px}
  .login-btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ffb26b,#ff85a8);cursor:pointer;margin-top:12px}
  .login-btn.parent{background:linear-gradient(135deg,#7b6cff,#9c8bff)}
  .login-err{color:#e0607e;font-size:12px;min-height:16px;margin-top:8px}
  .pin-in{width:100%;border:1.5px solid #e3e6f2;border-radius:14px;padding:13px;text-align:center;font-size:20px;letter-spacing:8px;outline:none}
  .login-tip{font-size:11px;color:var(--muted);line-height:1.7;margin-top:18px}

  /* 日报弹层 */
  .modal-mask{position:fixed;inset:0;background:rgba(40,30,60,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center}
  .modal{width:100%;max-width:520px;max-height:92vh;background:#fff;border-radius:22px 22px 0 0;overflow-y:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .modal-head h2{font-size:16px;margin:0;font-weight:800}
  .modal-head .x{border:0;background:#f4f1ff;color:#9a94ac;border-radius:50%;width:30px;height:30px;font-size:18px;cursor:pointer;line-height:1}
  .modal-actions{display:flex;gap:9px;margin-top:13px}
  .modal-actions button{flex:1;border:0;border-radius:14px;padding:12px;font-size:13px;font-weight:800;cursor:pointer}
  .btn-send{background:linear-gradient(135deg,#7b6cff,#9c8bff);color:#fff}
  .btn-save{background:linear-gradient(135deg,#4ecb8f,#38b87b);color:#fff}
  .page{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="nav" id="nav"></div>
<input type="file" id="fileIn" accept="application/json" style="display:none">
<script>
/* ============ 数据 ============ */
var KEY='baby_study_desk_v1';
var todayStr=(function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
var ROLE_KEY='baby_desk_role_v1';
var role=sessionStorage.getItem(ROLE_KEY)||'';
var loginRole='baby';

function defaultData(){
  return {
    name:'CoCo', avatar:'🐣', lastOpen:todayStr,
    stars:0, totalStars:0, todayStars:0, streak:0, lastCheckin:'', checkinDays:[],
    auth:{parentPin:'8899'},
    tasks:{
      song:{title:'听英文儿歌',icon:'🎵',color:'c1',star:1,done:false},
      hanzi:{title:'认识中文字',icon:'🈶',color:'c2',star:1,done:false},
      number:{title:'学习数字',icon:'🔢',color:'c3',star:1,done:false},
      word:{title:'学习单词',icon:'🔤',color:'c4',star:1,done:false},
      workbook:{title:'全脑练习册',icon:'🧠',color:'c5',star:1,done:false}
    },
    wishes:[
      {id:'w1',title:'看一集动画片',cost:10},
      {id:'w2',title:'去公园玩',cost:20},
      {id:'w3',title:'买一本绘本',cost:30}
    ],
    history:{},
    journals:{}
  };
}
var D;
function load(){
  try{var raw=localStorage.getItem(KEY);D=raw?JSON.parse(raw):defaultData()}catch(e){D=defaultData()}
  if(!D.tasks||!D.wishes)D=defaultData();
  if(!D.auth)D.auth={parentPin:'8899'};
  if(!D.checkinDays)D.checkinDays=[];
  if(!D.history)D.history={};
  if(!D.journals)D.journals={};
  if(!D.lastCheckin)D.lastCheckin='';
  if(D.name==='宝宝')D.name='CoCo';   // 旧数据迁移：默认名升级为 CoCo
  rollover();save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('存储空间不足')}}
function rollover(){
  if(D.lastOpen!==todayStr){
    var c=0,t=0;
    for(var k in D.tasks){t++;if(D.tasks[k].done)c++}
    D.history[D.lastOpen]={done:c,total:t,stars:D.todayStars||0};
    for(var k2 in D.tasks){D.tasks[k2].done=false}
    D.todayStars=0;D.lastOpen=todayStr;
  }
  if(D.todayStars===undefined)D.todayStars=0;
}
function taskKeys(){return ['song','hanzi','number','word','workbook']}
function doneCount(){var c=0,n=0;taskKeys().forEach(function(k){n++;if(D.tasks[k].done)c++});return{done:c,total:n}}

/* ============ 学习内容 ============ */
var HANZI=[
  {c:'人',p:'rén'},{c:'口',p:'kǒu'},{c:'手',p:'shǒu'},{c:'眼',p:'yǎn'},
  {c:'日',p:'rì'},{c:'月',p:'yuè'},{c:'水',p:'shuǐ'},{c:'火',p:'huǒ'},
  {c:'山',p:'shān'},{c:'大',p:'dà'},{c:'小',p:'xiǎo'},{c:'妈',p:'mā'}
];
var NUMBERS=[
  {n:'1',p:'一',e:'one'},{n:'2',p:'二',e:'two'},{n:'3',p:'三',e:'three'},{n:'4',p:'四',e:'four'},
  {n:'5',p:'五',e:'five'},{n:'6',p:'六',e:'six'},{n:'7',p:'七',e:'seven'},{n:'8',p:'八',e:'eight'},
  {n:'9',p:'九',e:'nine'},{n:'10',p:'十',e:'ten'}
];
var WORDS=[
  {w:'apple',z:'苹果',e:'🍎'},{w:'banana',z:'香蕉',e:'🍌'},{w:'cat',z:'小猫',e:'🐱'},{w:'dog',z:'小狗',e:'🐶'},
  {w:'egg',z:'鸡蛋',e:'🥚'},{w:'fish',z:'鱼',e:'🐟'},{w:'sun',z:'太阳',e:'☀️'},{w:'moon',z:'月亮',e:'🌙'},
  {w:'bird',z:'小鸟',e:'🐦'},{w:'car',z:'汽车',e:'🚗'},{w:'ball',z:'球',e:'⚽'},{w:'milk',z:'牛奶',e:'🥛'}
];
var SONGS=[
  {n:'Head Shoulders Knees Toes',e:'🎵',src:'audio/headshoulders.m4a',video:'video/headshoulders.mp4'}
];
var LYRICS=[
  'Head, shoulders, knees and toes, knees and toes.'
];
/* 内置旋律：不依赖网络，点击即用设备扬声器播放 */
var MELODIES={
  'Head Shoulders Knees Toes':{bpm:100,notes:
    'G4:2 A4:1 G4:1 F#4:1 G4:1 E4:2 '+
    'G4:2 G4:1 G4:1 '+
    'G4:2 A4:1 G4:1 F#4:1 G4:1 E4:2 '+
    'G4:2 G4:1 F4:1 '+
    'E4:1 D4:1 C4:1 E4:1 G4:2 '+
    'C5:1 D5:1 C5:1 B4:1 C5:1 A4:2 '+
    'B4:2 B4:1 G4:1 A4:1 B4:1 C5:2 '+
    'C4:2 C4:1 C4:1'}
};
var NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var NOTE_FREQ=(function(){var m={};for(var o=1;o<=7;o++){for(var i=0;i<12;i++){m[NOTE_NAMES[i]+o]=440*Math.pow(2,((o-4)*12+i-9)/12)}}return m})();
function noteHz(p){
  p=String(p).replace('Bb','A#').replace('Db','C#').replace('Eb','D#').replace('Gb','F#').replace('Ab','G#');
  return NOTE_FREQ[p]||0;
}

/* ============ 语音 ============ */
function speak(text,lang){
  try{
    if(!('speechSynthesis' in window)){toast('此设备不支持朗读');return}
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=lang||'zh-CN';u.rate=.85;u.pitch=1.15;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function cheer(){speak(['真棒！','太厉害啦！','CoCo好聪明！','做得好！'][Math.floor(Math.random()*4)],'zh-CN')}

/* ============ 视图 ============ */
var view='home';
var app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function loginHTML(){
  return '<div class="login-wrap"><div class="login-card">'+

function sayItem(el,text,lang,extra){
  speak(text,lang);
  el.classList.add('speaking');setTimeout(function(){el.classList.remove('speaking')},900);
  if(extra)setTimeout(function(){speak(extra,'en-US')},950);
}
var audioCtx=null,songOscs=[],songTimer=null,songPlaying=-1;
var songAudio=null,audioFallbackDone=false;
function getAudioCtx(){
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;
  if(!audioCtx)audioCtx=new AC();
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}
function getSongAudio(){
  if(!songAudio){
    songAudio=new Audio();
    songAudio.preload='none';
    songAudio.addEventListener('ended',function(){stopSong()});
    songAudio.addEventListener('error',function(){
      if(songPlaying>=0&&songOscs.length===0&&!audioFallbackDone){
        var i=songPlaying,m=MELODIES[SONGS[i].n];
        if(m){audioFallbackDone=true;playMelody(i,m)}
      }
    });
  }
  return songAudio;
}
function markSong(el,i){
  songPlaying=i;
  var list=document.querySelectorAll?document.querySelectorAll('.song'):[];
  for(var j=0;j<list.length;j++)list[j].classList.remove('playing');
  if(el&&el.classList)el.classList.add('playing');
}
function stopSong(){
  if(songAudio){try{songAudio.pause();songAudio.currentTime=0}catch(e){}}
  songOscs.forEach(function(o){try{o.stop()}catch(e){}});songOscs=[];
  if(songTimer){clearTimeout(songTimer);songTimer=null}
  songPlaying=-1;audioFallbackDone=false;
  var list=document.querySelectorAll?document.querySelectorAll('.song'):[];
  for(var i=0;i<list.length;i++)list[i].classList.remove('playing');
}
function playMelody(i,m){
  var ctx=getAudioCtx();
  if(!ctx||!m)return;
  var spb=60/(m.bpm||100),t0=ctx.currentTime+0.06,beat=0;
  m.notes.split(/\s+/).forEach(function(item){
    if(!item)return;
    var p=item.split(':'),hz=noteHz(p[0]),dur=parseFloat(p[1]||'1')*spb;
    if(!hz||!dur)return;
    var osc=ctx.createOscillator(),g=ctx.createGain();
    osc.type='triangle';osc.frequency.value=hz;
    g.gain.setValueAtTime(0.0001,t0+beat);
    g.gain.linearRampToValueAtTime(0.18,t0+beat+0.02);
    g.gain.setValueAtTime(0.18,t0+beat+dur*0.72);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+beat+dur*0.98);
    osc.connect(g);g.connect(ctx.destination);
    osc.start(t0+beat);osc.stop(t0+beat+dur);
    songOscs.push(osc);
    beat+=dur;
  });
  songTimer=setTimeout(stopSong,(beat+0.4)*1000);
}
/* 本地视频播放：第一首歌用仓库内的 mp4 直接播放，不依赖第三方嵌入 */
function openSongVideo(el,i){
  var s=SONGS[i];if(!s||!s.video)return false;
  closeSongVideo(false);
  markSong(el,i);
  var mask=document.createElement('div');
  mask.className='video-mask';mask.id='songVideoMask';
  mask.innerHTML='<div class="video-box">'+
    '<div class="video-bar"><b>📺 '+esc(s.n)+'</b><button onclick="closeSongVideo()">✕ 关闭</button></div>'+
    '<div class="video-frame"><video id="songVideoEl" src="'+esc(s.video)+'" controls autoplay loop playsinline webkit-playsinline preload="auto" style="position:absolute;top:0;left:0;width:100%;height:100%;background:#000"></video></div>'+
    '<div class="video-foot"><span>视频会自动循环播放，无需联网。若无法播放，可点下方用本地音频。</span>'+
    '<button onclick="closeSongVideo(false);playLocalAudio('+i+')">🎵 改用本地音频</button></div>'+
    '</div>';
  mask.addEventListener('click',function(e){if(e.target===mask)closeSongVideo()});
  document.body.appendChild(mask);
  var v=document.getElementById('songVideoEl');
  if(v){var p=v.play();if(p&&p.catch)p.catch(function(){})}
  return true;
}
function closeSongVideo(showToast){
  var mask=document.getElementById('songVideoMask');
  if(mask&&mask.parentNode)mask.parentNode.removeChild(mask);
  var list=document.querySelectorAll?document.querySelectorAll('.song'):[];
  for(var j=0;j<list.length;j++)list[j].classList.remove('playing');
  songPlaying=-1;
  if(showToast!==false)toast('已关闭视频');
}
function stopAllSongs(){closeSongVideo(false);stopSong();toast('已停止')}
function playLocalAudio(i){
  var s=SONGS[i];if(!s)return;
  var list=document.querySelectorAll?document.querySelectorAll('.song'):[];
  markSong(list[i],i);
  audioFallbackDone=false;
  var m=MELODIES[s.n];
  if(s.src&&typeof Audio!=='undefined'){
    var a=getSongAudio();
    try{
      a.src=s.src;a.currentTime=0;
      var p=a.play();
      if(p&&p.catch)p.catch(function(){
        if(songPlaying===i&&songOscs.length===0&&!audioFallbackDone){
          audioFallbackDone=true;
          if(m)playMelody(i,m);else{speak(s.n,'en-US');toast('播放失败，已改为朗读')}
        }
      });
      toast('🎵 正在演唱：'+s.n);
      return;
    }catch(e){}
  }
  if(m){playMelody(i,m);toast('🎵 正在播放旋律：'+s.n)}
  else{speak(s.n,'en-US');toast('此设备暂不支持播放，已改为朗读')}
}
function playSong(el,i){
  var s=SONGS[i];if(!s)return;
  if(songPlaying===i){stopAllSongs();return}
  stopAllSongs();
  if(s.video&&openSongVideo(el,i))return;
  markSong(el,i);
  audioFallbackDone=false;
  var m=MELODIES[s.n];
  if(s.src&&typeof Audio!=='undefined'){
    var a=getSongAudio();
    try{
      a.src=s.src;a.currentTime=0;
      var p=a.play();
      if(p&&p.catch)p.catch(function(){
        if(songPlaying===i&&songOscs.length===0&&!audioFallbackDone){
          audioFallbackDone=true;
          if(m)playMelody(i,m);else{speak(s.n,'en-US');toast('播放失败，已改为朗读')}
        }
      });
      toast('🎵 正在演唱：'+s.n);
      return;
    }catch(e){}
  }
  if(m){playMelody(i,m);toast('🎵 正在播放旋律：'+s.n)}
  else{speak(s.n,'en-US');toast('此设备暂不支持播放，已改为朗读')}
}
function checkin(){
  if(D.checkinDays.indexOf(todayStr)>=0)return;
  var y=new Date();y.setDate(y.getDate()-1);
  var yk=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  D.streak=(D.lastCheckin===yk)?D.streak+1:1;
  D.lastCheckin=todayStr;D.checkinDays.push(todayStr);
  D.stars+=1;D.totalStars+=1;D.todayStars+=1;
  save();render();confetti();toast('打卡成功！+1 🌺 连续 '+D.streak+' 天');
}

function redeem(id){
  var w=D.wishes.filter(function(x){return x.id===id})[0];if(!w)return;
  if(D.stars<w.cost){toast('小红花还不够哦');return}
  if(role!=='parent'){toast('已申请「'+w.title+'」，告诉爸爸妈妈吧');return}
  if(!confirm('确认用 '+w.cost+' 朵小红花兑换「'+w.title+'」吗？'))return;
  D.stars-=w.cost;save();render();toast('兑换成功！记得兑现礼物 🎁');
}
function addWish(){
  var t=prompt('礼物名称：');if(!t)return;
  var c=parseInt(prompt('需要多少朵小红花？','10'),10)||10;
  D.wishes.push({id:'w'+Date.now(),title:t.trim(),cost:c});save();render();toast('礼物已添加');
}
function delWish(id){D.wishes=D.wishes.filter(function(w){return w.id!==id});save();render()}
function editStar(k){
  var t=D.tasks[k];
  var v=parseInt(prompt('「'+t.title+'」每次得几朵小红花？',t.star),10);
  if(v&&v>0){t.star=v;save();render();toast('已改为 '+v+' 朵')}
}
function changeName(){var v=(document.getElementById('newName').value||'').trim();if(v){D.name=v;save();render();toast('名字已保存')}}
function changePin(){
  var v=(document.getElementById('newPin').value||'').trim();
  if(!v){toast('留空表示不修改');return}
  if(v.length<4){toast('口令至少 4 位');return}
  D.auth.parentPin=v;save();render();toast('家长口令已修改');
}

/* 登录 */
function enterBaby(){role='baby';try{sessionStorage.setItem(ROLE_KEY,role)}catch(e){}view='home';render();}
function enterParent(){
  var v=(document.getElementById('pinIn').value||'').trim();
  if(v!==D.auth.parentPin){document.getElementById('loginErr').textContent='口令不正确';return}
  role='parent';try{sessionStorage.setItem(ROLE_KEY,role)}catch(e){}view='home';render();toast('已进入家长模式');
}
function doLogout(){
  if(!confirm('退出登录？'))return;
  role='';try{sessionStorage.removeItem(ROLE_KEY)}catch(e){}view='home';render();
}

/* 日报 */
function addJournal(){
  var inp=document.getElementById('journalInput');
  var v=(inp&&inp.value||'').trim();
  if(!v){toast('请输入学习内容');return}
  if(!D.journals[todayStr])D.journals[todayStr]=[];
  var d=new Date();
  var tm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  D.journals[todayStr].push({id:'j'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),text:v,time:tm});
  save();render();toast('已记录啦 📝');
  var ni=document.getElementById('journalInput');if(ni)ni.value='';
}
function delJournal(id){
  if(!D.journals[todayStr])return;
  D.journals[todayStr]=D.journals[todayStr].filter(function(j){return j.id!==id});
  save();render();toast('已删除记录');
}

function reportData(){
  var cnt=doneCount();
  var d=new Date();var wk=['日','一','二','三','四','五','六'][d.getDay()];
  var doneList=taskKeys().filter(function(k){return D.tasks[k].done}).map(function(k){return D.tasks[k].title});
  var notes=(D.journals[todayStr]||[]).map(function(j){return j.text});
  var msg=cnt.done===5?'今天五项任务全部完成，太棒啦！':cnt.done>=3?'今天表现很棒，继续加油！':cnt.done>0?'完成了几项任务，明天再来！':'今天还没开始，明天一起加油！';
  return{name:D.name,date:(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wk,streak:D.streak,stars:D.todayStars,total:D.totalStars,done:cnt.done,doneList:doneList,notes:notes,msg:msg};
}
function reportText(r){
  var L=['🐣 '+r.name+'的学习日报',r.date+'　连续打卡 '+r.streak+' 天','',
    '✅ 今日完成 '+r.done+'/5 项','🌺 今日获得 '+r.stars+' 朵小红花（累计 '+r.total+' 朵）',''];
  if(r.doneList.length){L.push('完成的项目：');r.doneList.forEach(function(t){L.push('  ✓ '+t)})}
  else L.push('今天还没有完成任务');
  if(r.notes&&r.notes.length){L.push('','📝 学到的内容：');r.notes.forEach(function(t){L.push('  · '+t)})}
  L.push('','💬 '+r.msg,'—— 来自CoCo学习工作台');
  return L.join('\n');
}
function reportCanvas(r){
  var W=750,H=1040,c=document.createElement('canvas');c.width=W;c.height=H;
  var g=c.getContext('2d');
  var bg=g.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#fff6e8');bg.addColorStop(.5,'#ffeff5');bg.addColorStop(1,'#eef6ff');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  function rr(x,y,w,h,rad){g.beginPath();g.moveTo(x+rad,y);g.arcTo(x+w,y,x+w,y+h,rad);g.arcTo(x+w,y+h,x,y+h,rad);g.arcTo(x,y+h,x,y,rad);g.arcTo(x,y,x+w,y,rad);g.closePath()}
  g.fillStyle='#fff';rr(40,40,W-80,H-80,36);g.fill();
  var head=g.createLinearGradient(64,64,W-64,250);head.addColorStop(0,'#ffb26b');head.addColorStop(1,'#ff85a8');
  g.fillStyle=head;rr(64,64,W-128,190,28);g.fill();
  g.fillStyle='#fff';g.textAlign='left';g.font='bold 42px sans-serif';g.fillText(r.name+'的学习日报',96,160);
  g.font='22px sans-serif';g.fillStyle='rgba(255,255,255,.92)';g.fillText(r.date,96,206);
  var stats=[['完成项目',r.done+'/5','#7b6cff'],['今日小红花','+'+r.stars,'#ff9f2e'],['连续打卡',r.streak+'天','#ff7aa8']];
  var sw=(W-128-32)/3;
  stats.forEach(function(s,i){var x=64+i*(sw+16);g.fillStyle='#faf8ff';rr(x,286,sw,120,20);g.fill();g.textAlign='center';
    g.fillStyle=s[2];g.font='bold 38px sans-serif';g.fillText(s[1],x+sw/2,344);g.fillStyle='#9a94ac';g.font='21px sans-serif';g.fillText(s[0],x+sw/2,382)});
  g.textAlign='left';g.fillStyle='#3a3450';g.font='bold 28px sans-serif';g.fillText('今日完成',64,470);
  var rows=r.doneList.length?r.doneList:['今天还没有完成任务'];
  rows.slice(0,5).forEach(function(t,i){var y=512+i*46;g.fillStyle='#4ecb8f';g.beginPath();g.arc(80,y-9,15,0,Math.PI*2);g.fill();
    g.fillStyle='#fff';g.font='bold 18px sans-serif';g.textAlign='center';g.fillText('✓',80,y-3);
    g.textAlign='left';g.fillStyle='#3a3450';g.font='24px sans-serif';g.fillText(t,110,y)});
  var noteY=512+Math.max(rows.length,1)*46+18;
  if(r.notes&&r.notes.length){
    g.textAlign='left';g.fillStyle='#3a3450';g.font='bold 28px sans-serif';g.fillText('📝 学到的内容',64,noteY);
    r.notes.slice(0,4).forEach(function(t,i){var y=noteY+42+i*40;
      g.fillStyle='#ffb02e';g.beginPath();g.arc(80,y-9,8,0,Math.PI*2);g.fill();
      g.fillStyle='#3a3450';g.font='23px sans-serif';g.fillText(t.length>22?t.slice(0,22)+'…':t,100,y)});
  }
  g.fillStyle='#fff6e8';rr(64,H-160,W-128,96,20);g.fill();
  g.fillStyle='#d9821f';g.font='bold 25px sans-serif';g.textAlign='center';g.fillText('💬 '+r.msg,W/2,H-104);
  g.fillStyle='#b0a9bd';g.font='18px sans-serif';g.fillText('来自CoCo学习工作台',W/2,H-78);
  return c.toDataURL('image/png');
}
function openReport(){
  var r=reportData();window._rimg=reportCanvas(r);window._rtxt=reportText(r);
  var m=document.getElementById('reportModal2')||document.createElement('div');
  m.id='reportModal2';
  m.innerHTML='<div class="modal-mask" onclick="if(event.target===this)closeReport()"><div class="modal">'+
    '<div class="modal-head"><h2>📱 宝宝日报</h2><button class="x" onclick="closeReport()">×</button></div>'+
    '<div style="text-align:center;background:#faf9ff;border-radius:14px;padding:12px;border:1px solid #f0eef8">'+
      '<img src="'+window._rimg+'" style="width:100%;border-radius:12px;display:block"><p class="hint">长按图片保存，发微信给家人</p></div>'+
    '<div class="modal-actions"><button class="btn-send" onclick="copyReport()">📋 复制文字发微信</button>'+
      '<button class="btn-save" onclick="saveReport()">💾 保存图片</button></div>'+
  '</div></div>';
  if(!m.parentNode)document.body.appendChild(m);else m.style.display='';
}
function closeReport(){var m=document.getElementById('reportModal2');if(m)m.innerHTML=''}
function copyReport(){
  var txt=window._rtxt||'';
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast('已复制，去微信粘贴')},function(){fbCopy(txt)});
  else fbCopy(txt);
}
function fbCopy(txt){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制，去微信粘贴')}catch(e){toast('请手动复制')}document.body.removeChild(ta)}
function saveReport(){try{var a=document.createElement('a');a.href=window._rimg;a.download='宝宝日报_'+todayStr+'.png';document.body.appendChild(a);a.click();document.body.removeChild(a);toast('图片已保存')}catch(e){toast('请长按图片保存')}}

function exportData(){
  var blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='宝宝工作台备份_'+todayStr+'.json';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1000);toast('备份已下载');
}
document.getElementById('fileIn').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(!o.tasks||!o.wishes)throw 0;
    if(!confirm('导入将覆盖当前数据，确定吗？'))return;
    D=o;D.lastOpen=todayStr;rollover();save();render();toast('导入成功')}catch(err){toast('文件格式不正确')}};
  r.readAsText(f);e.target.value='';
});
function resetAll(){
  if(!confirm('⚠️ 清空所有数据恢复初始状态？不可恢复，建议先导出备份。'))return;
  if(!confirm('再次确认要重置吗？'))return;
  D=defaultData();save();render();toast('已重置');
}

/* ============ 启动 ============ */
load();render();
</script>
</body>
